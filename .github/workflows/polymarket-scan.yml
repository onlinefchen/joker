name: polymarket-scan

on:
  workflow_dispatch:
    inputs:
      test_ping:
        description: "Send test telegram ping"
        required: false
        default: "true"
  schedule:
    - cron: '3,28,53 * * * *'

concurrency:
  group: polymarket-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-polymarket-0.1.4

      - name: Install Polymarket CLI
        run: |
          if ! command -v polymarket >/dev/null 2>&1; then
            cargo install --git https://github.com/Polymarket/polymarket-cli.git --locked --force
          fi
          polymarket --version

      - name: Configure Polymarket key
        env:
          POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.config/polymarket
          cat > ~/.config/polymarket/config.json <<EOF
          {
            "private_key": "${POLYMARKET_PRIVATE_KEY}",
            "chain_id": 137,
            "signature_type": "gnosis-safe"
          }
          EOF
          chmod 600 ~/.config/polymarket/config.json

      - name: Run tracker
        run: |
          python polymarket_insider_tracker.py \
            --wallet-limit 30 \
            --trades-limit 200 \
            --lookback-hours 0 \
            --min-score 60 \
            --top 20 \
            --sleep-ms 0 \
            --action-min-size 100000 \
            --action-side all \
            --action-lookback-hours 1 \
            --state-file tracker_state.json \
            --out suspects.json \
            --report-md tracker_report.md

      - name: Commit state + outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker_state.json suspects.json tracker_report.md || true
          git commit -m "chore: update tracker outputs" || echo "No changes"
          git pull --rebase || true
          git push || echo "Nothing to push"

      - name: Telegram test ping (manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_ping == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request
          token = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '').strip()
          if not token or not chat_id:
              raise SystemExit(0)
          text = "✅ GitHub Actions 测试通知成功（polymarket-scan）"
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          payload = urllib.parse.urlencode({"chat_id": chat_id, "text": text}).encode()
          urllib.request.urlopen(url, data=payload, timeout=20).read()
          PY

      - name: Setup SSH proxy (Japan)
        env:
          PROXY_SSH_KEY: ${{ secrets.PROXY_SSH_KEY }}
          PROXY_SSH_HOST: ${{ secrets.PROXY_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$PROXY_SSH_KEY" > ~/.ssh/proxy_key
          chmod 600 ~/.ssh/proxy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/proxy_key -D 1080 -fN root@$PROXY_SSH_HOST
          sudo apt-get install -y -qq proxychains4 > /dev/null 2>&1
          sudo tee /etc/proxychains4.conf > /dev/null << 'EOF'
          strict_chain
          proxy_dns
          [ProxyList]
          socks5 127.0.0.1 1080
          EOF
          echo "proxychains4 ready"

      - name: Restore copy trader state
        uses: actions/cache/restore@v4
        with:
          path: copy_state.json
          key: copy-state-${{ github.run_id }}
          restore-keys: |
            copy-state-

      - name: Copy trade (auto follow)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COPY_DRY_RUN: ${{ secrets.COPY_DRY_RUN || 'false' }}
          COPY_MAX_PER_TRADE: '0'
          COPY_MAX_EXPOSURE: '0'
          COPY_BALANCE_PERCENT: '0.20'
          USE_PROXYCHAINS: 'true'
        run: python copy_trader.py

      - name: Save copy trader state
        uses: actions/cache/save@v4
        with:
          path: copy_state.json
          key: copy-state-${{ github.run_id }}

      - name: Commit copy state
        run: |
          git add copy_state.json || true
          git commit -m "chore: update copy trader state" || echo "No changes"
          git pull --rebase || true
          git push || echo "Nothing to push"

      - name: Telegram notify (new core wallets)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timezone

          def short_addr(a: str) -> str:
              return f"{a[:6]}...{a[-4:]}" if isinstance(a, str) and len(a) > 12 else str(a)

          token = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '').strip()
          if not token or not chat_id:
              raise SystemExit(0)

          with open('suspects.json','r',encoding='utf-8') as f:
              data = json.load(f)

          rows = data.get('suspects', [])
          cores = [r for r in rows if r.get('tier') == 'core']
          if not cores:
              raise SystemExit(0)

          # Load previously notified trades
          notified_file = 'notified_trades.json'
          notified = set()
          if os.path.exists(notified_file):
              try:
                  with open(notified_file, 'r') as nf:
                      notified = set(json.load(nf).get('trades', []))
              except Exception:
                  pass

          ts = datetime.now(timezone.utc).strftime('%m-%d %H:%M UTC')

          # 近1小时 >=100k 大单
          big = []
          for r in cores:
              for a in (r.get('recent_actions') or []):
                  a2 = dict(a)
                  a2['wallet'] = r.get('wallet', '')
                  # Unique key: wallet + slug + side + outcome + size
                  trade_key = f"{a2['wallet']}:{a.get('slug','')}:{a.get('side','')}:{a.get('outcome','')}:{a.get('size','')}"
                  a2['_key'] = trade_key
                  if trade_key not in notified:
                      big.append(a2)

          if not big:
              # Heartbeat every 4 hours (UTC) on the first quarter-hour run
              now = datetime.now(timezone.utc)
              if now.hour % 4 == 0 and now.minute < 15:
                  hb = f"✅ Polymarket 监控心跳 ({now.strftime('%m-%d %H:%M UTC')})\n最近1小时无单笔≥$100k交易，任务运行正常。"
                  url = f"https://api.telegram.org/bot{token}/sendMessage"
                  payload = urllib.parse.urlencode({"chat_id": chat_id, "text": hb}).encode()
                  urllib.request.urlopen(url, data=payload, timeout=20).read()
              raise SystemExit(0)

          lines = [f"📡 Polymarket 大单监控 ({ts})", "仅推送：近1小时、单笔≥$100k", "\n【新大单】"]
          big.sort(key=lambda x: float(x.get('size', 0)), reverse=True)
          new_keys = []
          for j, a in enumerate(big[:8], 1):
              addr = short_addr(a.get('wallet', ''))
              side = a.get('side', '')
              size = float(a.get('size', 0))
              title = a.get('title') or a.get('slug', '')
              outcome = a.get('outcome', '')
              price = float(a.get('price', 0))
              lines.append(f"{j}) {addr} {side} ${size:,.0f} @ {price:.3f} · {outcome}")
              lines.append(f"   标的: {title}")
              new_keys.append(a['_key'])

          msg = "\n".join(lines)
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          payload = urllib.parse.urlencode({"chat_id": chat_id, "text": msg}).encode()
          urllib.request.urlopen(url, data=payload, timeout=20).read()

          # Save notified trades (keep last 200)
          notified.update(new_keys)
          notified_list = list(notified)[-200:]
          with open(notified_file, 'w') as nf:
              json.dump({"trades": notified_list}, nf)
          PY

      - name: Commit notified state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add notified_trades.json || true
          git commit -m "chore: update notified trades" || echo "No changes"
          git push || echo "Nothing to push"
