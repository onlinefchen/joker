name: polymarket-scan

on:
  workflow_dispatch:
    inputs:
      test_ping:
        description: "Send test telegram ping"
        required: false
        default: "true"
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-polymarket-0.1.4

      - name: Install Polymarket CLI
        run: |
          if ! command -v polymarket >/dev/null 2>&1; then
            cargo install --git https://github.com/Polymarket/polymarket-cli.git --locked --force
          fi
          polymarket --version

      - name: Configure Polymarket key
        env:
          POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.config/polymarket
          cat > ~/.config/polymarket/config.json <<EOF
          {
            "private_key": "${POLYMARKET_PRIVATE_KEY}",
            "chain_id": 137,
            "signature_type": "gnosis-safe"
          }
          EOF
          chmod 600 ~/.config/polymarket/config.json

      - name: Run tracker
        run: |
          python polymarket_insider_tracker.py \
            --wallet-limit 30 \
            --trades-limit 200 \
            --lookback-hours 1 \
            --min-score 60 \
            --top 20 \
            --sleep-ms 0 \
            --action-min-size 100000 \
            --action-side all \
            --state-file tracker_state.json \
            --out suspects.json \
            --report-md tracker_report.md

      - name: Commit state + outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker_state.json suspects.json tracker_report.md || true
          git commit -m "chore: update tracker outputs" || echo "No changes"
          git push

      - name: Telegram test ping (manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_ping == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request
          token = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '').strip()
          if not token or not chat_id:
              raise SystemExit(0)
          text = "✅ GitHub Actions 测试通知成功（polymarket-scan）"
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          payload = urllib.parse.urlencode({"chat_id": chat_id, "text": text}).encode()
          urllib.request.urlopen(url, data=payload, timeout=20).read()
          PY

      - name: Telegram notify (new core wallets)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timezone

          def short_addr(a: str) -> str:
              return f"{a[:6]}...{a[-4:]}" if isinstance(a, str) and len(a) > 12 else str(a)

          token = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '').strip()
          if not token or not chat_id:
              raise SystemExit(0)

          with open('suspects.json','r',encoding='utf-8') as f:
              data = json.load(f)

          rows = data.get('suspects', [])
          cores = [r for r in rows if r.get('tier') == 'core']
          if not cores:
              raise SystemExit(0)

          ts = datetime.now(timezone.utc).strftime('%m-%d %H:%M UTC')
          lines = [f"📡 Polymarket Core 监控 ({ts})", "窗口: 最近1小时｜仅看单笔≥$100k", f"共 {len(cores)} 个 Core 地址"]

          for i, r in enumerate(cores[:5], 1):
              addr = short_addr(r.get('wallet', ''))
              score = float(r.get('score', 0))
              delta = float(r.get('delta_score', 0))
              arrow = "🔺" if delta > 0 else ("🔻" if delta < 0 else "⏸")
              m = r.get('metrics') or {}
              total_buy = float(m.get('total_buy_size', 0))
              total_sell = float(m.get('total_sell_size', 0))
              lines.append(f"{i}) {addr}  分数 {score:.0f} ({arrow}{delta:+.0f})")
              lines.append(f"   样本买入: ${total_buy:,.0f} / 卖出: ${total_sell:,.0f}")

              acts = r.get('recent_actions') or []
              if acts:
                  a = acts[0]
                  side = a.get('side', '')
                  size = float(a.get('size', 0))
                  title = a.get('title') or a.get('slug', '')
                  outcome = a.get('outcome', '')
                  price = float(a.get('price', 0))
                  lines.append(f"   标的: {title}")
                  lines.append(f"   最近大单: {side} ${size:,.0f} @ {price:.3f} · {outcome}")
              else:
                  lines.append("   标的: 近1小时无>=100k动作")

          lines.append("\n(仅显示前5，完整名单见仓库 report)")
          msg = "\n".join(lines)

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          payload = urllib.parse.urlencode({"chat_id": chat_id, "text": msg}).encode()
          urllib.request.urlopen(url, data=payload, timeout=20).read()
          PY
